<svg xmlns="http://www.w3.org/2000/svg" width="680" height="122" viewBox="0 0 680 122" role="img" aria-label="Frases motivacionales de desarrollo e Inteligencia Artificial">
  <style>text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }</style>
  <rect x="0.5" y="0.5" width="679" height="121" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="52" font-size="48" fill="#58a6ff" opacity="0.5" font-family="Georgia, serif">“</text>
  <text x="340" y="60" text-anchor="middle" font-size="14" fill="#c9d1d9" opacity="0">La IA no reemplaza al buen ingeniero; potencia la visión de quien domina la arquitectura y el código a fondo.
    <animate attributeName="opacity" dur="40.0s" repeatCount="indefinite" keyTimes="0.0;0.01;0.115;0.125;1.0" values="0;1;1;0;0"/>
  </text>
  <text x="340" y="60" text-anchor="middle" font-size="14" fill="#c9d1d9" opacity="0">Entrena tu lógica como a una red neuronal: cada error de compilación es solo una época más de aprendizaje.
    <animate attributeName="opacity" dur="40.0s" repeatCount="indefinite" keyTimes="0.0;0.125;0.135;0.24;0.25;1.0" values="0;0;1;1;0;0"/>
  </text>
  <text x="340" y="60" text-anchor="middle" font-size="14" fill="#c9d1d9" opacity="0">Automatiza con inteligencia lo repetitivo y enfoca tu creatividad en resolver problemas de alto impacto.
    <animate attributeName="opacity" dur="40.0s" repeatCount="indefinite" keyTimes="0.0;0.25;0.26;0.365;0.375;1.0" values="0;0;1;1;0;0"/>
  </text>
  <text x="340" y="60" text-anchor="middle" font-size="14" fill="#c9d1d9" opacity="0">La verdadera IA nace de bases de datos limpias, algoritmos seguros y sistemas diseñados con propósito.
    <animate attributeName="opacity" dur="40.0s" repeatCount="indefinite" keyTimes="0.0;0.375;0.385;0.49;0.5;1.0" values="0;0;1;1;0;0"/>
  </text>
  <text x="340" y="60" text-anchor="middle" font-size="14" fill="#c9d1d9" opacity="0">Diseña pensando en escalabilidad y seguridad: la IA acelera el camino, pero tu criterio define el destino.
    <animate attributeName="opacity" dur="40.0s" repeatCount="indefinite" keyTimes="0.0;0.5;0.51;0.615;0.625;1.0" values="0;0;1;1;0;0"/>
  </text>
  <text x="340" y="60" text-anchor="middle" font-size="14" fill="#c9d1d9" opacity="0">Un fallo en producción no es el final; es el mejor dataset para entrenar una solución mucho más robusta.
    <animate attributeName="opacity" dur="40.0s" repeatCount="indefinite" keyTimes="0.0;0.625;0.635;0.74;0.75;1.0" values="0;0;1;1;0;0"/>
  </text>
  <text x="340" y="60" text-anchor="middle" font-size="14" fill="#c9d1d9" opacity="0">El prompt perfecto inspira ideas, pero la arquitectura sólida y el código limpio las hacen realidad.
    <animate attributeName="opacity" dur="40.0s" repeatCount="indefinite" keyTimes="0.0;0.75;0.76;0.865;0.875;1.0" values="0;0;1;1;0;0"/>
  </text>
  <text x="340" y="60" text-anchor="middle" font-size="14" fill="#c9d1d9" opacity="0">La constancia le gana al talento, y la disciplina supera a cualquier algoritmo sin una dirección clara.
    <animate attributeName="opacity" dur="40.0s" repeatCount="indefinite" keyTimes="0.0;0.875;0.885;0.99;1.0" values="0;0;1;1;0"/>
  </text>
  <text x="340" y="98" text-anchor="middle" font-size="13.5" font-style="italic" fill="#58a6ff">— Iñaki Sobera Sotomayor</text>
</svg>

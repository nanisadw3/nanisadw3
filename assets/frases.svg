<svg xmlns="http://www.w3.org/2000/svg" width="540" height="136" viewBox="0 0 540 136" role="img" aria-label="Frases motivacionales de desarrollo e Inteligencia Artificial">
  <style>text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }</style>
  <rect x="0.5" y="0.5" width="539" height="135" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="20" y="52" font-size="44" fill="#58a6ff" opacity="0.45" font-family="Georgia, serif">“</text>
  <g opacity="0">
    <text x="270" y="52" text-anchor="middle" font-size="13.5" fill="#c9d1d9">La IA no reemplaza al buen arquitecto;</text>
    <text x="270" y="74" text-anchor="middle" font-size="13.5" fill="#c9d1d9">potencia a quien domina la robustez del backend.</text>
    <animate attributeName="opacity" dur="44.0s" repeatCount="indefinite" keyTimes="0.0;0.01;0.115;0.125;1.0" values="0;1;1;0;0"/>
  </g>
  <g opacity="0">
    <text x="270" y="52" text-anchor="middle" font-size="13.5" fill="#c9d1d9">Un prompt genera ideas en segundos, pero la arquitectura</text>
    <text x="270" y="74" text-anchor="middle" font-size="13.5" fill="#c9d1d9">y el código limpio las convierten en soluciones reales.</text>
    <animate attributeName="opacity" dur="44.0s" repeatCount="indefinite" keyTimes="0.0;0.125;0.135;0.24;0.25;1.0" values="0;0;1;1;0;0"/>
  </g>
  <g opacity="0">
    <text x="270" y="52" text-anchor="middle" font-size="13.5" fill="#c9d1d9">Entrena tu lógica con disciplina técnica:</text>
    <text x="270" y="74" text-anchor="middle" font-size="13.5" fill="#c9d1d9">cada bug superado es una época más de aprendizaje.</text>
    <animate attributeName="opacity" dur="44.0s" repeatCount="indefinite" keyTimes="0.0;0.25;0.26;0.365;0.375;1.0" values="0;0;1;1;0;0"/>
  </g>
  <g opacity="0">
    <text x="270" y="52" text-anchor="middle" font-size="13.5" fill="#c9d1d9">Agentes autónomos y modelos de pesos abiertos:</text>
    <text x="270" y="74" text-anchor="middle" font-size="13.5" fill="#c9d1d9">el futuro del software con soberanía y privacidad.</text>
    <animate attributeName="opacity" dur="44.0s" repeatCount="indefinite" keyTimes="0.0;0.375;0.385;0.49;0.5;1.0" values="0;0;1;1;0;0"/>
  </g>
  <g opacity="0">
    <text x="270" y="52" text-anchor="middle" font-size="13.5" fill="#c9d1d9">Automatiza con inteligencia artificial lo repetitivo,</text>
    <text x="270" y="74" text-anchor="middle" font-size="13.5" fill="#c9d1d9">y enfoca tu talento en diseñar sistemas de alto impacto.</text>
    <animate attributeName="opacity" dur="44.0s" repeatCount="indefinite" keyTimes="0.0;0.5;0.51;0.615;0.625;1.0" values="0;0;1;1;0;0"/>
  </g>
  <g opacity="0">
    <text x="270" y="52" text-anchor="middle" font-size="13.5" fill="#c9d1d9">Construir IA local exige paciencia y rigor:</text>
    <text x="270" y="74" text-anchor="middle" font-size="13.5" fill="#c9d1d9">un commit sólido vale más que cien líneas improvisadas.</text>
    <animate attributeName="opacity" dur="44.0s" repeatCount="indefinite" keyTimes="0.0;0.625;0.635;0.74;0.75;1.0" values="0;0;1;1;0;0"/>
  </g>
  <g opacity="0">
    <text x="270" y="52" text-anchor="middle" font-size="13.5" fill="#c9d1d9">La seguridad y la ética no son un parche final;</text>
    <text x="270" y="74" text-anchor="middle" font-size="13.5" fill="#c9d1d9">se programan desde la arquitectura y cada endpoint.</text>
    <animate attributeName="opacity" dur="44.0s" repeatCount="indefinite" keyTimes="0.0;0.75;0.76;0.865;0.875;1.0" values="0;0;1;1;0;0"/>
  </g>
  <g opacity="0">
    <text x="270" y="52" text-anchor="middle" font-size="13.5" fill="#c9d1d9">La constancia técnica siempre le gana a la casualidad;</text>
    <text x="270" y="74" text-anchor="middle" font-size="13.5" fill="#c9d1d9">la disciplina es el algoritmo que construye el éxito.</text>
    <animate attributeName="opacity" dur="44.0s" repeatCount="indefinite" keyTimes="0.0;0.875;0.885;0.99;1.0" values="0;0;1;1;0"/>
  </g>
  <text x="270" y="108" text-anchor="middle" font-size="12.5" font-style="italic" fill="#58a6ff">— Iñaki Sobera Sotomayor</text>
</svg>
